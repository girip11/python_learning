[project]
name = "python-learning"
version = "0.1.0"
description = "Python learning."
license = "MIT"
authors = [{ name = "girish pasupathy", email = "girishpasupathy@gmail.com" }]
requires-python = ">=3.14"

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "requests>=2.32.5",
    "numba>=0.63.1",
]

[project.optional-dependencies]
nvidia = ["pycuda>=2025.1.2"]

[dependency-groups]
dev = [
    "ipython>=9.9.0",
    "ipython-memory-usage>=1.8.3",
    "jupyter>=1.1.1",
    "jupyter-http-over-ws>=0.0.8",
    "mypy>=1.19.1",
    "ty>=0.0.12",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "tuna>=0.5.11",
    "line-profiler>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    # Core Python
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle

    # Type annotations
    "ANN", # flake8-annotations - enforce type annotations
    "TCH", # flake8-type-checking - optimize type-checking imports
    "FA",  # flake8-future-annotations - use modern annotation syntax

    # Pythonic practices
    "B",    # flake8-bugbear - common bugs and design problems
    "C4",   # flake8-comprehensions - better comprehensions
    "SIM",  # flake8-simplify - simplify code
    "PIE",  # flake8-pie - misc lints
    "RET",  # flake8-return - return statement issues
    "PTH",  # flake8-use-pathlib - prefer pathlib over os.path
    "FURB", # refurb - modernize code
    "PERF", # perflint - performance anti-patterns
    "RUF",  # ruff-specific rules

    # Modernization
    "UP",  # pyupgrade - upgrade syntax for newer Python
    "PYI", # flake8-pyi - type stub best practices

    # Code quality
    "A",   # flake8-builtins - don't shadow builtins
    "C90", # mccabe - complexity
    "ERA", # eradicate - commented out code
    "PL",  # pylint
    "TRY", # tryceratops - exception handling
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "TRY003", # Avoid long messages in raise
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",       # No docstrings required in tests
    "ANN",     # No type annotations required in tests
    "PLR2004", # Magic values OK in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["python_learning"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# mypy configuration
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Strict type checking
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
strict_concatenate = true

# Import handling
ignore_missing_imports = false
follow_imports = "normal"

# Error reporting
show_error_context = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["numba.*", "pycuda.*"]
ignore_missing_imports = true

# ty configuration
[tool.ty]
python-version = "3.14"

[tool.ty.rules]
possibly-unresolved-reference = "error"
invalid-type-form = "error"
call-non-callable = "error"
not-iterable = "error"
invalid-context-manager = "error"
invalid-raise = "error"
invalid-exception-caught = "error"
invalid-return-type = "error"
invalid-assignment = "error"
invalid-argument-type = "error"
conflicting-declarations = "error"
invalid-base = "error"
invalid-generic = "error"
invalid-overload = "error"
invalid-type-variable-constraints = "error"
missing-argument = "error"
too-many-positional-arguments = "error"
unknown-argument = "error"
parameter-already-assigned = "error"
unresolved-import = "warn"
unresolved-reference = "warn"
unused-ignore-comment = "warn"
